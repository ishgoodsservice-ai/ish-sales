/* ============================================================
 * 頁面與初始化
 * ============================================================ */
/** 不需登入：後台登入畫面需要的設定 */
function apiPublicConfig() {
  const imgs = imageMap_(), st = settings_();
  return { appName: st.appName, logo: imgs.logo || '', accent: st.accent };
}

function setup(email) {
  email = String(email || '').toLowerCase();
  if (email && admins_().indexOf(email) < 0) setAdmins_(admins_().concat([email]));
  writeSettings_(settings_());
  if (!read_('locations').length) {
    append_('locations', [
      { id: 'L-main', name: '主倉', note: '工作室倉庫', sort: 1 },
      { id: 'L-shop', name: '門市', note: '現場銷售用', sort: 2 },
    ]);
  }
  if (!read_('staff').length) append_('staff', [{ id: 'U' + newId_(), name: '店長', locationId: 'L-shop', active: true, sort: 1, createdAt: new Date() }]);
}
/** 第一次使用：系統擁有者登入後建立管理者名單，並匯入 VGhouse 範本 */
function apiFirstRun() {
  const email = String(DB.email() || '').toLowerCase();
  if (!email) throw new Error('NO_GOOGLE');
  if (admins_().length) { admin_(); } else if (email !== OWNER_EMAIL) throw new Error('第一次使用請用 ' + OWNER_EMAIL + ' 登入');
  setupVGhouseTemplate(email);
  return true;
}

/** 選用：匯入 VGhouse 展覽範本（場次、目標、亮面／霧面、2 隻組）。可重複執行，不會重複建立。 */
function setupVGhouseTemplate(email) {
  setup(email);
  const st = settings_();
  st.eventName = 'VGhouse 展覽';
  st.eventNote = '只記錄銷售；財務與對帳由祐齊處理。';
  st.unit = '隻';
  st.totalTarget = 1000;
  writeSettings_(st);
  const ps = read_('products');
  const ensure = function (name, spec) {
    const hit = ps.filter(function (p) { return p.name === name && p.spec === spec; })[0];
    if (hit) return String(hit.id);
    return apiSaveProduct_raw_({ name: name, spec: spec, price: 1380, unit: '隻', active: true });
  };
  const a = ensure('Coin Cat', '亮面'), b = ensure('Coin Cat', '霧面');
  if (!read_('bundles').length) {
    append_('bundles', [{ id: 'B' + newId_(), name: '2 隻組', size: 2, price: 2500, productIds: [a, b].join(','), active: true, sort: 1 }]);
  }
  if (!read_('sessions').length) {
    append_('sessions', [
      ['2026-12-08', '貴賓場（週二）'], ['2026-12-11', '活動第 1 天（週五）'], ['2026-12-12', '活動第 2 天（週六）'],
      ['2026-12-13', '活動第 3 天（週日）'], ['2026-12-14', '活動第 4 天（週一）'],
    ].map(function (x, i) { return { id: 'S' + newId_() + i, date: x[0], name: x[1], target: 200, note: i === 0 ? '貴賓場是否販售待 VG 確認' : '', sort: i + 1, start: '00:00', end: '23:59' }; }));
  }
}

/* ============================================================
 * 銷售人員登入（只選名字，不需密碼）
 * ============================================================ */
function apiLoginInfo() {
  const imgs = imageMap_(), st = settings_();
  return {
    settings: { appName: st.appName, logo: imgs.logo || '', accent: st.accent },
    staff: staffOut_().filter(function (u) { return u.active; }).map(function (u) { return { id: u.id, name: u.name }; }),
  };
}

/* ============================================================
 * 銷售端
 * ============================================================ */
function apiBootstrap(sid) {
  const acc = staff_(sid);
  const imgs = imageMap_();
  return {
    user: { id: acc.id, name: acc.name, locationId: String(acc.locationId || '') },

/** 新增與修改訂單共用：計算價格、組合、場次、收款 */
function buildOrder_(acc, order, st, base) {
  const pmap = indexBy_(read_('products'), 'id'), locs = indexBy_(read_('locations'), 'id');
  const loc = locs[base ? base.locationId : order.locationId] || locs[acc.locationId];
  if (!loc) throw new Error('找不到出貨倉儲，請在「我」重新選擇');
  const sessions = sessionsOut_();
  const time = base ? base.time : (order.time ? new Date(order.time) : new Date());
  let sess = null;
  if (base) sess = sessions.filter(function (s) { return s.id === base.sessionId; })[0] || null;
  else if (st.autoSession) sess = sessionAt_(sessions, time);
  else if (order.sessionId) sess = sessions.filter(function (s) { return s.id === order.sessionId; })[0] || null;
  else if (order.sessionId === undefined) sess = currentSession_(sessions, time, st);
  const lines = order.lines.map(function (l) {
    const p = pmap[l.productId];
    if (!p) throw new Error('找不到品項：' + l.productId);
    const qty = Math.max(1, Math.round(Number(l.qty) || 0));
    const price = st.allowPriceEdit && l.price !== undefined && l.price !== '' ? Math.max(0, Number(l.price) || 0) : num_(p.price);
    const kind = st.allowPreorder && l.kind === '預購' ? '預購' : '現貨';
    return { productId: String(p.id), qty: qty, price: price, kind: kind, name: p.name + (p.spec ? '／' + p.spec : '') };
  });
  const pr = priceCart_(lines, bundlesOut_().filter(function (b) { return b.active; }), order.sets || {});
  const sum = function (kind, f) { return pr.lines.filter(function (l) { return l.kind === kind; }).reduce(function (a, l) { return a + l[f]; }, 0); };
  const revenue = sum('現貨', 'net'), preAmt = sum('預購', 'net');
  const hasPre = pr.lines.some(function (l) { return l.kind === '預購'; });
  const customer = String(order.customer || '').trim(), phone = String(order.phone || '').trim(), address = String(order.address || '').trim();
  if (hasPre && st.preorderContact && !customer && !phone) throw new Error('預購需要填寫客人姓名或電話');
  if (hasPre && st.preorderAddress && !address) throw new Error('預購需要填寫地址');
  const collected = revenue + (st.preorderPaid ? preAmt : 0);
  const payment = String(order.payment || '');
  const ecpay = isEcpay_(st, payment);
  if (ecpay && (!st.salesUrl || !st.apiUrl)) throw new Error('請管理者先在「系統」填入網站網址與綠界函式網址，才能使用綠界掃碼付款');
  if (ecpay && collected <= 0) throw new Error('本次收款為 0，不需要綠界付款');
  const isCash = payment === st.cashName;
  const received = isCash && order.cashReceived !== undefined && order.cashReceived !== '' && order.cashReceived !== null ? Math.round(Number(order.cashReceived)) : '';
  if (received !== '' && received < collected) throw new Error('實收金額不足');
  const setsObj = {}; pr.applied.forEach(function (a) { if (a.sets) setsObj[a.id] = a.sets; });
  const sid = sess ? sess.id : '';
  const noPay = collected <= 0;
  const confirmed = noPay || (isCash && received !== '') || (!ecpay && !isCash && order.confirmed === true);
  return {
    time: time, ecpay: ecpay, collected: collected,
    fields: {
      sessionId: sid, sessionName: sess ? sess.name : '一般銷售', locationId: loc.id, locationName: loc.name, payment: payment,
      units: sum('現貨', 'qty'), preUnits: sum('預購', 'qty'),
      sets: pr.applied.reduce(function (a, x) { return a + x.sets; }, 0),
      setsText: pr.applied.filter(function (a) { return a.sets; }).map(function (a) { return a.name + '×' + a.sets; }).join('、'),
      setsJson: JSON.stringify(setsObj), subtotal: pr.subtotal, discount: pr.discount, total: revenue, preorderAmount: preAmt, collected: collected,
      customer: customer, phone: phone, address: address, note: String(order.note || ''),
      payStatus: ecpay ? '待付款' : '已收款', cashReceived: received, change: received === '' ? '' : received - collected, payKey: '',
      confirmed: confirmed, confirmedBy: confirmed ? (noPay ? '（無需收款）' : acc.name) : '', confirmedAt: confirmed ? new Date() : '',
    },
    items: function (orderId) {
      return pr.lines.map(function (l) {
        return { time: time, orderId: orderId, productId: l.productId, productName: l.name, kind: l.kind, qty: l.qty,
                 listPrice: l.price, amount: l.net, sessionId: sid, staffName: acc.name, locationId: loc.id, status: '正常' };
      });
    },
    stockOut: function (orderId, reason) {
      return pr.lines.filter(function (l) { return l.kind === '現貨'; }).map(function (l) {
        return { productId: l.productId, locationId: loc.id, delta: -l.qty, reason: reason, ref: orderId };
      });
    },
  };
}

function apiEditMyOrder(sid, orderId, order) {
  const acc = staff_(sid), st = settings_();

    o.editedAt = new Date();

  } finally { lock.releaseLock(); }

/** 綠界付款改成其他方式（例如客人改付現金） */
function apiSetPayment(sid, orderId, payment, cashReceived) {
  const acc = staff_(sid), st = settings_();
  const lock = LockService.getScriptLock(); lock.waitLock(20000);
  try {
    const o = myOrder_(acc, orderId, true);
    if (isEcpay_(st, payment)) throw new Error('請選擇其他付款方式');
    const rec = payment === st.cashName && cashReceived !== undefined && cashReceived !== '' && cashReceived !== null ? Math.round(Number(cashReceived)) : '';
    if (rec !== '' && rec < num_(o.collected)) throw new Error('實收金額不足');
    o.payment = payment; o.payStatus = '已收款'; o.payKey = ''; o.cashReceived = rec; o.change = rec === '' ? '' : rec - num_(o.collected); o.editedAt = new Date();
    o.confirmed = true; o.confirmedBy = acc.name; o.confirmedAt = new Date();
    update_('orders', o);
    return { order: orderWithItems_(o) };
  } finally { lock.releaseLock(); }
}

function apiAdjustStock(a) {

/* ============================================================
 * 價格計算（前後端共用同一段邏輯）
 * ============================================================ */
function priceCart_(lines, bundles, setsReq) {
  const units = [];
  lines.forEach(function (l, i) { for (let k = 0; k < l.qty; k++) units.push({ i: i, pid: l.productId, price: Number(l.price) || 0, net: Number(l.price) || 0, used: false }); });
  const applied = [];
  bundles.forEach(function (b) {
    const ids = b.productIds || [];
    const elig = units.filter(function (u) { return !u.used && (!ids.length || ids.indexOf(u.pid) >= 0); })
      .sort(function (x, y) { return y.price - x.price; });
    const max = Math.floor(elig.length / b.size);
    if (!max) return;
    const want = setsReq && setsReq[b.id] !== undefined && setsReq[b.id] !== null ? Math.floor(Number(setsReq[b.id]) || 0) : max;
    const n = Math.max(0, Math.min(max, want));
    let done = 0, saving = 0;
    for (let s = 0; s < n; s++) {
      const grp = elig.slice(s * b.size, (s + 1) * b.size);
      const sum = grp.reduce(function (a, u) { return a + u.price; }, 0);
      if (sum <= b.price) continue;
      grp.forEach(function (u) { u.used = true; u.net = b.price * u.price / sum; });
      saving += sum - b.price; done++;
    }
    applied.push({ id: b.id, name: b.name, size: b.size, price: b.price, sets: done, max: max, saving: Math.round(saving) });
  });
  const out = lines.map(function (l) { const o = {}; Object.keys(l).forEach(function (k) { o[k] = l[k]; }); o.net = 0; return o; });
  units.forEach(function (u) { out[u.i].net += u.net; });
  const subtotal = lines.reduce(function (a, l) { return a + l.qty * (Number(l.price) || 0); }, 0);
  const total = Math.round(units.reduce(function (a, u) { return a + u.net; }, 0));
  out.forEach(function (l) { l.net = Math.round(l.net); });
  const drift = total - out.reduce(function (a, l) { return a + l.net; }, 0);
  if (drift && out.length) out.reduce(function (m, l) { return l.net > m.net ? l : m; }, out[0]).net += drift;
  return { lines: out, applied: applied, subtotal: subtotal, total: total, discount: subtotal - total };
}

function summary_(acc) {

    }

  let mo = 0, mr = 0, ao = 0, mu = 0;

  });

  return {

    today: { units: tu, revenue: tr, pre: tp, orders: ao, myOrders: mo, myRevenue: mr, myUnconfirmed: mu },
    event: {

function applyStock_(changes) {
  if (!changes.length) return;
  const key = function (p, l) { return p + '|' + l; };
  const map = {};
  read_('stock').forEach(function (s) { map[key(s.productId, s.locationId)] = s; });
  const pmap = indexBy_(read_('products'), 'id'), lmap = indexBy_(read_('locations'), 'id');
  const now = new Date(), logs = [], touched = {}, fresh = [];
  changes.forEach(function (c) {
    const k = key(c.productId, c.locationId);
    let row = map[k];
    if (!row) { row = { productId: c.productId, locationId: c.locationId, qty: 0 }; map[k] = row; fresh.push(row); }
    const before = num_(row.qty), after = c.set !== undefined ? Number(c.set) : before + Number(c.delta);
    row.qty = after; row.updatedAt = now; touched[k] = row;
    if (after !== before || c.set !== undefined) {
      const p = pmap[c.productId];
      logs.push({ time: now, productId: c.productId, productName: p ? p.name + (p.spec ? '／' + p.spec : '') : '',
                  locationId: c.locationId, locationName: lmap[c.locationId] ? String(lmap[c.locationId].name) : '',
                  delta: after - before, balance: after, reason: c.reason || '', ref: c.ref || '' });
    }
  });
  Object.keys(touched).forEach(function (k) { if (touched[k]._row) update_('stock', touched[k]); });
  append_('stock', fresh);
  append_('stockLog', logs);
}

  },
  getUuid: function () { return (globalThis.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function () { return (Math.random() * 16 | 0).toString(16); }); },
};
/** 網頁呼叫的入口：執行一個 api 函式，這次的寫入一次送出 */
function apiCall_(req) {
  const fn = String((req && req.fn) || '');
  if (!/^api[A-Za-z]+$/.test(fn) || typeof globalThis[fn] !== 'function') return Promise.resolve({ ok: false, error: '未知的功能：' + fn });
  return Promise.resolve()
    .then(function () { return globalThis[fn].apply(null, Array.isArray(req.args) ? req.args : []); })
    .then(function (out) { return DB.flush().then(function (info) { return { ok: true, data: out === undefined ? null : out, queued: !!(info && info.queued) }; }); })
    .catch(function (e) { DB.discard(); return { ok: false, error: String((e && e.message) || e).replace(/^(Exception|Error|FirebaseError):\s{0,9}/, '') }; });
}

      auth = A.getAuth(app);
      await new Promise(res => { const off = A.onAuthStateChanged(auth, u => { user = u; off(); res(); }); });
      A.onAuthStateChanged(auth, u => { user = u; });
      if (!user) { const r = await A.signInAnonymously(auth); user = r.user; }
      await this.listen();
      return api;
    },
    listen() {
      return new Promise((resolve, reject) => {
        let pending = KEYS.length + 2, done = false;
        const one = () => { if (--pending === 0 && !done) { done = true; resolve(); } };
        const fail = e => { if (!done) { done = true; reject(e); } else errorCbs.forEach(f => f(e)); };
        KEYS.forEach(key => {
          F.onSnapshot(F.collection(db, key), s => {
            let remote = false;
            s.docChanges().forEach(ch => {
              const id = ch.doc.id;
              if (ch.type === 'removed') { snap[key].delete(id); mem[key].delete(id); }
              else { const v = fromFs(key, ch.doc.data()); snap[key].set(id, v); mem[key].set(id, Object.assign({}, v)); }
              if (!ch.doc.metadata.hasPendingWrites) remote = true;
            });
            if (!firstLoaded[key]) { firstLoaded[key] = true; one(); } else if (remote) fireChange();
          }, fail);
        });
        F.onSnapshot(ref('config', 'admins'), d => { admins = ((d.exists() && d.data().emails) || []).map(x => String(x).toLowerCase()); if (!firstLoaded._a) { firstLoaded._a = true; one(); } }, fail);
        F.onSnapshot(ref('config', 'ecpay'), d => { if (d.exists()) ecpayPub = Object.assign({ mode: 'stage', mid: '', hasKey: false, hasIv: false }, d.data()); if (!firstLoaded._e) { firstLoaded._e = true; one(); } }, fail);
      });
    },

    /* ---------- 讀 ---------- */
    read(key) {
      const first = cols(key)[0];
      return [...mem[key].entries()].filter(([, v]) => v[first] !== '' && v[first] !== null && v[first] !== undefined)
        .sort((a, b) => (a[1]._s || 0) - (b[1]._s || 0) || (a[0] < b[0] ? -1 : 1))
        .map(([id, v]) => { const o = { _row: id }; cols(key).forEach(c => { o[c] = v[c] === undefined ? '' : v[c]; }); return o; });
    },

    /* ---------- 寫（先放進這次的批次，flush 時一起送出） ---------- */
    append(key, objs) {
      objs.forEach(o => {
        let id = idFor(key, o);
        if (!id) id = F.doc(F.collection(db, key)).id;
        const cur = mem[key].get(id), data = clean(key, o);
        data._s = cur && cur._s ? cur._s : newSeq();
        if (key === 'stock') {
          const add = Number(o.qty) || 0;
          mem[key].set(id, Object.assign({}, data, { qty: (cur ? Number(cur.qty) || 0 : 0) + add }));
          push('set', ref(key, id), Object.assign({}, data, { qty: F.increment(add) }), { merge: true });
        } else {
          mem[key].set(id, Object.assign({}, data));
          push('set', ref(key, id), data, { merge: true });
        }
      });
    },
    update(key, o) {
      const id = o._row, cur = mem[key].get(id);
      if (!cur) throw new Error('這筆資料已不存在，請重新整理');
      const data = clean(key, o), diff = {};
      cols(key).forEach(c => { if (!same(data[c], cur[c] === undefined ? '' : cur[c])) diff[c] = data[c]; });
      if (!Object.keys(diff).length) return;
      if (key === 'stock' && 'qty' in diff) diff.qty = F.increment((Number(data.qty) || 0) - (Number(cur.qty) || 0));
      mem[key].set(id, Object.assign({}, cur, data));
      push('set', ref(key, id), diff, { merge: true });
    },
    setField(key, id, col, v) {
      const cur = mem[key].get(id); if (!cur) return;
      v = (v === undefined || v === null) ? '' : v;
      cur[col] = v;
      push('set', ref(key, id), { [col]: v }, { merge: true });
    },
    put(key, id, o) {
      const cur = mem[key].get(id), data = clean(key, o);
      data._s = cur && cur._s ? cur._s : newSeq();
      if (cur && cols(key).every(c => same(data[c], cur[c] === undefined ? '' : cur[c]))) return;
      mem[key].set(id, Object.assign({}, data));
      push('set', ref(key, id), data, { merge: true });
    },
    remove(key, id) { mem[key].delete(id); push('delete', ref(key, id)); },

    admins() { return admins.slice(); },
    setAdmins(a) { admins = a.map(x => String(x).toLowerCase()); push('set', ref('config', 'admins'), { emails: admins }, { merge: true }); },
    email() { return user && !user.isAnonymous ? String(user.email || '').toLowerCase() : ''; },
    ecpayPublic() { return Object.assign({}, ecpayPub); },
    saveEcpay(c) {
      const priv = {}, pub = {};
      if (c.mode) { priv.mode = c.mode; pub.mode = c.mode; }
      if (c.mid !== undefined) { priv.mid = c.mid; pub.mid = c.mid; }
      if (c.key) { priv.key = c.key; pub.hasKey = true; }
      if (c.iv) { priv.iv = c.iv; pub.hasIv = true; }
      if (Object.keys(priv).length) push('set', ref('private', 'ecpay'), priv, { merge: true });
      if (Object.keys(pub).length) push('set', ref('config', 'ecpay'), pub, { merge: true });
      ecpayPub = Object.assign({}, ecpayPub, pub);
      return this.ecpayPublic();
    },
    links() {
      const p = cfg.projectId;
      return { console: 'https:\/\/console.firebase.google.com/project/' + p + '/firestore/databases/-default-/data', storage: 'https:\/\/console.firebase.google.com/project/' + p + '/storage' };
    },

    /* ---------- 送出 ---------- */
    async flush() {
      if (!ops.length) return { queued: false };
      const list = ops; ops = [];
      const chunks = [];
      for (let i = 0; i < list.length; i += 450) chunks.push(list.slice(i, i + 450));
      const commits = chunks.map(ch => {
        const b = F.writeBatch(db);
        ch.forEach(op => op.type === 'delete' ? b.delete(op.r) : b.set(op.r, op.data, op.opts || {}));
        return b.commit();
      });
      const all = Promise.all(commits);
      all.catch(e => errorCbs.forEach(f => f(e)));
      // 有網路時等伺服器確認（最多 6 秒）；離線時資料已存在裝置上，連線後自動上傳
      const t = new Promise(res => setTimeout(() => res('timeout'), navigator.onLine ? 6000 : 300));
      const r = await Promise.race([all.then(() => 'ok'), t]);
      return { queued: r === 'timeout' };
    },
    discard() { ops = []; KEYS.forEach(k => { mem[k] = new Map([...snap[k]].map(([id, v]) => [id, Object.assign({}, v)])); }); },

    /* ---------- 檔案（簡介 PDF） ---------- */
    async storage() {
      if (!S) { storageMod = await import(BASE + 'firebase-storage.js'); S = storageMod.getStorage(app); }
      return storageMod;
    },
    async putFile(path, b64, type) {
      const m = await this.storage();
      const r = await m.uploadString(m.ref(S, path), b64, 'base64', { contentType: type || 'application/pdf' });
      return Number(r.metadata.size) || 0;
    },
    async fileBase64(path) {
      const m = await this.storage();
      const buf = new Uint8Array(await m.getBytes(m.ref(S, path)));
      let bin = ''; for (let i = 0; i < buf.length; i += 32768) bin += String.fromCharCode.apply(null, buf.subarray(i, i + 32768));
      return btoa(bin);
    },
    async deleteFile(path) { const m = await this.storage(); await m.deleteObject(m.ref(S, path)); },

    /* ---------- 登入 ---------- */
    async signInGoogle() {
      const p = new A.GoogleAuthProvider(); p.setCustomParameters({ prompt: 'select_account' });
      const r = await A.signInWithPopup(auth, p);
      user = r.user;
      return this.email();
    },
    async signOut() { await A.signOut(auth); const r = await A.signInAnonymously(auth); user = r.user; },
    onChange(f) { changeCbs.push(f); },
    onError(f) { errorCbs.push(f); },
  };
  return api;
};

</script>

.minibars .b{width:100%;max-width:36px;background:var(--ink);position:relative}
.minibars .b.now{background:var(--ac)}
.minibars .b.future{background:transparent;border:1px dashed var(--line2);border-bottom:0}
.minibars .tg{position:absolute;left:-5px;right:-5px;border-top:1px dashed var(--ink)}
.mlabels{display:flex;gap:10px;margin-top:8px}.mlabels span{flex:1;text-align:center}
.cline{padding:16px 0;border-bottom:1px solid var(--line)}
.cline .top{display:flex;align-items:baseline;gap:10px}
.cline .nm{font-weight:500;flex:1;font-size:16px}
.cline .ctl{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.pr{width:104px;min-height:40px;padding:6px 10px;text-align:right}
.grand{display:flex;justify-content:space-between;align-items:baseline;padding:16px 0 4px}
.grand .n{font-size:34px;font-weight:300;letter-spacing:-.03em}
.lbl{margin:22px 0 10px}
.bund{display:flex;align-items:center;gap:12px;border:1px solid var(--ink);padding:12px 12px 12px 16px;margin-top:16px}
.bund .t{flex:1}.bund b{display:block;font-weight:500}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.qrbig{width:min(300px,80vw);aspect-ratio:1;margin:22px auto 10px;display:grid;place-items:center;background:#fff;border:1px solid var(--line);transition:opacity .3s}
.qrbig svg,.qrbig img{width:100%;height:100%;display:block;object-fit:contain}
.paystat{text-align:center;margin:6px 0 14px;font-size:16px}
.paid{color:var(--ok);font-size:26px;font-weight:500;margin:0}
.change{display:flex;align-items:baseline;justify-content:space-between;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.change b{font-size:44px;font-weight:300;letter-spacing:-.03em;color:var(--ac)}
.qrgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 12px;border-top:1px solid var(--ink);padding-top:18px}
.qrcard{border:0;background:none;padding:0;text-align:left;display:grid;gap:4px}
.qrcard b{font-weight:500;font-size:15px;margin-top:6px}
.qrbox{aspect-ratio:1;background:#fff;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;padding:8px}
.qrbox svg,.qrbox img{width:100%;height:100%;display:block;object-fit:contain}
.srow{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.srow .thumb{width:52px;height:52px}
.srow b{font-weight:500;display:block}
.srow .q{font-size:30px;font-weight:300;letter-spacing:-.03em;text-align:right;line-height:1}
.srow .q small{display:block;font-size:11px;letter-spacing:.04em;margin-top:4px}
.mtx{font-size:13.5px}.mtx th,.mtx td{padding:9px 6px}
.mtx td.cur,.mtx th.cur{background:var(--soft);font-weight:500}
.names{border-top:1px solid var(--ink)}
.names button{display:flex;align-items:center;width:100%;padding:20px 2px;border:0;border-bottom:1px solid var(--line);background:none;font-size:22px;font-weight:400;letter-spacing:-.02em;text-align:left}
.names button:hover{background:var(--soft)}
.names button span{margin-left:auto;color:var(--ink3);font-size:18px}

/* PDF viewer */
.viewer{position:fixed;inset:0;background:var(--tile);z-index:70;display:flex;flex-direction:column}
.v-top{display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:#fff;border-bottom:1px solid var(--line)}
.v-top b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.v-body{flex:1;overflow:auto;padding:14px 0 40px;-webkit-overflow-scrolling:touch}
.pg{position:relative;margin:0 auto 14px;background:#fff;width:min(100% - 20px,900px)}
.pg canvas{display:block;width:100%;height:100%}
.pg .pn{position:absolute;right:8px;bottom:8px;font:500 11px var(--mono);background:#fff;padding:2px 6px;color:var(--ink2)}

/* ========== 後台 ========== */
.a{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.a-side{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);padding:28px 0 20px;display:flex;flex-direction:column;background:#fff}
.a-side .logo{margin:0 24px 36px;--lh:16px}
.nav{display:flex;align-items:center;gap:12px;width:100%;min-height:40px;padding:0 24px;border:0;background:none;text-align:left;color:var(--ink2);font-size:14px}
.nav::before{content:'';width:6px;height:6px;background:transparent;flex:none}
.nav:hover{color:var(--ink)}
.nav.on{color:var(--ink);font-weight:500}.nav.on::before{background:var(--ac)}
.a-side .me{margin-top:auto;padding:16px 24px 0;border-top:1px solid var(--line);font-size:13px;word-break:break-all}
.a-main{padding:28px clamp(20px,3.2vw,56px) 80px;max-width:1440px;width:100%}
.crumb{margin-bottom:14px}
.a-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-bottom:24px;margin-bottom:28px;border-bottom:1px solid var(--line)}
.a-head h1{font-size:clamp(34px,3.6vw,52px);line-height:1.02;font-weight:500;letter-spacing:-.035em}
.a-head p{margin:12px 0 0;color:var(--ink2);max-width:70ch}
.a-head .tt{flex:1;min-width:260px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--ink);border-bottom:1px solid var(--line);margin-bottom:48px}
.kpi{padding:16px 20px 20px;border-left:1px solid var(--line)}
.kpi:first-child{border-left:0;padding-left:0}
.kpi b{display:block;font-size:clamp(28px,2.7vw,42px);font-weight:300;margin:14px 0 6px;letter-spacing:-.04em;line-height:1}
.kpi .s{font-size:12.5px;color:var(--ink3)}
.kpi.main b{color:var(--ac);font-weight:400}
.kpi .bar{margin-top:10px}
.box{margin-bottom:52px}
.box>h3{display:flex;align-items:baseline;gap:12px;font-size:22px;padding-bottom:14px;border-bottom:1px solid var(--ink);margin-bottom:4px}
.box>h3 .sp{flex:1}
.box>h3 .lab{font-weight:400}
.cols{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:48px}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:48px}
.fig{position:relative;height:280px;margin-top:16px}
.fig svg{position:absolute;inset:0;width:100%;height:100%}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;padding:7px 10px;white-space:nowrap;transform:translate(-50%,-115%);opacity:0;transition:opacity .1s;z-index:2}
table.t{width:100%;border-collapse:collapse;font-size:14px}
.t th{text-align:left;font:500 11px/1.35 var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ink2);padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:bottom}
.t td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.t th:first-child,.t td:first-child{padding-left:0}
.t tbody tr:hover td{background:var(--soft)}
.t .r{text-align:right}
.t tr.void td{color:var(--ink3);text-decoration:line-through}
.t tr.void td:last-child{text-decoration:none}
.t tfoot td{font-weight:500;border-top:1px solid var(--ink);border-bottom:0}
.t.daily th{white-space:normal}
.t.daily th.r{min-width:68px}
.t td.ed,.t tbody tr:hover td.ed{background:var(--edit);padding:3px}
.t td.ed input{width:100%;min-height:36px;border:1px solid transparent;background:transparent;padding:4px 8px;font-size:14px}
.t td.ed input:focus{outline:none;background:#fff;border-color:var(--ink)}
.t td.ed input.r{text-align:right}
.scroll{overflow-x:auto}
.thumb{width:44px;height:44px;background:var(--tile);overflow:hidden;display:grid;place-items:center;flex:none;color:var(--ac);font-weight:300;font-size:18px}
.thumb img{width:100%;height:100%;object-fit:cover}
.blist .bl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 10px;padding:12px 0;border-bottom:1px solid var(--line)}
.blist .bar{grid-column:1/-1}
.cell{min-width:58px;min-height:36px;padding:0 10px;border:1px solid transparent;background:none;text-align:right;width:100%}
.cell:hover{border-color:var(--ink)}
.cell.neg{color:var(--red)}.cell.zero{color:var(--ink3)}
.drop{display:block;border:1px dashed var(--ink3);padding:44px;text-align:center;color:var(--ink2);transition:.15s;cursor:pointer;background:var(--soft)}
.drop.over{border-color:var(--ac);background:#fff}
.drop b{display:block;color:var(--ink);font-size:20px;font-weight:500;margin-bottom:6px}
.imgbox{width:180px;aspect-ratio:1;background:var(--tile);display:grid;place-items:center;overflow:hidden;cursor:pointer;color:var(--ink2);font-size:13px;text-align:center;flex:none;border:1px dashed var(--ink3)}
.imgbox img{width:100%;height:100%;object-fit:contain}
.ed2{display:flex;gap:24px}.ed2 .fs{flex:1}
.note{font-size:13.5px;color:var(--ink2);border-left:2px solid var(--line2);padding:2px 0 2px 12px;margin:14px 0}
.linkrow{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.linkrow code{flex:1;font:12px var(--mono);background:var(--soft);padding:9px 12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.togrow{display:flex;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.togrow div{flex:1}.togrow small{display:block;color:var(--ink3);font-size:12.5px}
.swatches{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.swatch{width:34px;height:22px;border:0;outline:1px solid var(--line2);outline-offset:2px}
.swatch.on{outline:1.5px solid var(--ink)}
.appset{display:grid;grid-template-columns:minmax(0,1fr) 392px;gap:48px;align-items:start}
.phonebox{position:sticky;top:24px;border:10px solid var(--ink);border-radius:44px;overflow:hidden;background:#fff}
.phonebox .scr{height:740px;overflow:auto}
.phonebox .scr .tile,.phonebox .scr .who{pointer-events:none}
.phonebox .scr .m-h{position:static}
.phonecap{text-align:center;margin-top:12px}
@media (max-width:1200px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.kpi:nth-child(4){border-left:0;padding-left:0}.cols,.cols2{grid-template-columns:1fr}.appset{grid-template-columns:1fr}.phonebox{position:static;max-width:392px}}
@media (max-width:860px){
  .a{grid-template-columns:1fr}
  .a-side{position:sticky;height:auto;flex-direction:row;overflow-x:auto;padding:12px 8px;z-index:20;border-right:0;border-bottom:1px solid var(--line);align-items:center}
  .a-side .logo{margin:0 14px;flex:none;--lh:13px}.a-side .me{display:none}.nav{width:auto;flex:none;white-space:nowrap;padding:0 12px}
  .ed2{flex-direction:column}.two{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi{border-left:0;padding-left:0}
}
.demo{display:flex;align-items:center;justify-content:center;gap:4px;background:var(--ink);color:#fff;padding:6px 10px;flex-wrap:wrap}
.demo span{padding:0 10px;color:rgba(255,255,255,.6);font:500 11px var(--mono);letter-spacing:.06em}
.demo a{padding:5px 14px;text-decoration:none;color:#fff;font-size:13px}
.demo a.on{background:#fff;color:var(--ink)}
.demo+#app .a-side{height:calc(100vh - 40px)}
@media (max-width:860px){.demo+#app .a-side{height:auto}}
</style>

/* 圖片：品項置中裁正方形、Logo 保留比例；壓到 45KB 以下（存在資料庫） */
function processImage(file, square = true) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = () => rej(new Error('讀不到圖片'));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => rej(new Error('這個格式無法讀取，請用 JPG 或 PNG'));
      img.onload = () => {
        for (const size of [600, 480, 400, 320, 240]) {
          const s = Math.min(img.width, img.height), k = size / Math.max(img.width, img.height);
          const w = square ? size : Math.round(img.width * k), h = square ? size : Math.round(img.height * k);
          const c = document.createElement('canvas'); c.width = w; c.height = h;
          const g = c.getContext('2d');
          if (square) { g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); g.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, w, h); }
          else g.drawImage(img, 0, 0, w, h);
          if (!square) { const d = c.toDataURL('image/png'); if (d.length < 45000) return res(d); continue; }
          for (const q of [0.86, 0.78, 0.7, 0.6]) { const d = c.toDataURL('image/jpeg', q); if (d.length < 45000) return res(d); }
        }
        rej(new Error('圖片壓縮失敗，請換一張'));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/*PRICE*/
function priceCart_(lines, bundles, setsReq) {
  const units = [];
  lines.forEach(function (l, i) { for (let k = 0; k < l.qty; k++) units.push({ i: i, pid: l.productId, price: Number(l.price) || 0, net: Number(l.price) || 0, used: false }); });
  const applied = [];
  bundles.forEach(function (b) {
    const ids = b.productIds || [];
    const elig = units.filter(function (u) { return !u.used && (!ids.length || ids.indexOf(u.pid) >= 0); })
      .sort(function (x, y) { return y.price - x.price; });
    const max = Math.floor(elig.length / b.size);
    if (!max) return;
    const want = setsReq && setsReq[b.id] !== undefined && setsReq[b.id] !== null ? Math.floor(Number(setsReq[b.id]) || 0) : max;
    const n = Math.max(0, Math.min(max, want));
    let done = 0, saving = 0;
    for (let s = 0; s < n; s++) {
      const grp = elig.slice(s * b.size, (s + 1) * b.size);
      const sum = grp.reduce(function (a, u) { return a + u.price; }, 0);
      if (sum <= b.price) continue;
      grp.forEach(function (u) { u.used = true; u.net = b.price * u.price / sum; });
      saving += sum - b.price; done++;
    }
    applied.push({ id: b.id, name: b.name, size: b.size, price: b.price, sets: done, max: max, saving: Math.round(saving) });
  });
  const out = lines.map(function (l) { const o = {}; Object.keys(l).forEach(function (k) { o[k] = l[k]; }); o.net = 0; return o; });
  units.forEach(function (u) { out[u.i].net += u.net; });
  const subtotal = lines.reduce(function (a, l) { return a + l.qty * (Number(l.price) || 0); }, 0);
  const total = Math.round(units.reduce(function (a, u) { return a + u.net; }, 0));
  out.forEach(function (l) { l.net = Math.round(l.net); });
  const drift = total - out.reduce(function (a, l) { return a + l.net; }, 0);
  if (drift && out.length) out.reduce(function (m, l) { return l.net > m.net ? l : m; }, out[0]).net += drift;
  return { lines: out, applied: applied, subtotal: subtotal, total: total, discount: subtotal - total };
}
/*/PRICE*/

const PDFJS = 'https:\/\/cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
let pdfLib; const pdfCache = {};
function loadPdfJs() {
  if (pdfLib) return Promise.resolve(pdfLib);
  return new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = PDFJS + 'pdf.min.js';
    s.onload = () => { pdfLib = window.pdfjsLib; pdfLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js'; res(pdfLib); };
    s.onerror = () => rej(new Error('PDF 閱讀器載入失敗，請檢查網路'));
    document.head.appendChild(s);
  });
}
async function openViewer(mat, who) {
  const v = document.createElement('div');
  v.className = 'viewer';
  v.innerHTML = `<div class="v-top"><button class="btn sm line" data-x>← 返回</button><b>${esc(mat.name)}</b><span class="lab" data-pc></span></div><div class="v-body"><div style="padding:60px 0"><div class="spin"></div></div></div>`;
  document.body.appendChild(v);
  const prev = document.body.style.overflow; document.body.style.overflow = 'hidden';
  let io;
  const close = () => { io && io.disconnect(); v.remove(); document.body.style.overflow = prev; document.removeEventListener('keydown', onKey); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  $('[data-x]', v).onclick = close;
  try {
    const lib = await loadPdfJs();
    let doc = pdfCache[mat.id];
    if (!doc) {
      const b64 = await api('apiMaterialData', who, mat.id);
      const bin = atob(b64), bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      doc = await lib.getDocument({ data: bytes, cMapUrl: PDFJS + 'cmaps/', cMapPacked: true, standardFontDataUrl: PDFJS + 'standard_fonts/' }).promise;
      pdfCache[mat.id] = doc;
    }
    if (!document.body.contains(v)) return;
    const body = $('.v-body', v); body.innerHTML = '';
    $('[data-pc]', v).textContent = doc.numPages + ' 頁';
    const vp0 = (await doc.getPage(1)).getViewport({ scale: 1 });
    for (let i = 1; i <= doc.numPages; i++) {
      const d = document.createElement('div'); d.className = 'pg'; d.dataset.p = i;
      d.style.aspectRatio = vp0.width + '/' + vp0.height;
      d.innerHTML = `<span class="pn">${i} / ${doc.numPages}</span>`;
      body.appendChild(d);
    }
    const render = async d => {
      if (d.dataset.done) return; d.dataset.done = 1;
      const page = await doc.getPage(+d.dataset.p);
      const vp1 = page.getViewport({ scale: 1 });
      d.style.aspectRatio = vp1.width + '/' + vp1.height;
      const vp = page.getViewport({ scale: Math.min(3, (d.clientWidth * Math.min(2, window.devicePixelRatio || 1)) / vp1.width) });
      const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height;
      d.prepend(c);
      await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
    };
    io = new IntersectionObserver(es => es.forEach(e => e.isIntersecting && render(e.target)), { root: body, rootMargin: '600px 0px' });
    $$('.pg', body).forEach(d => io.observe(d));
  } catch (e) {
    $('.v-body', v).innerHTML = `<div class="empty" style="margin:20px">${esc(e.message)}</div>`;
  }
}

const cartQty = pid => M.cart.filter(l => l.productId === pid).reduce((a, l) => a + l.qty, 0);

function renderSell() {
  const st = M.data.settings;
  const tabs = [['sell', '銷售', ICON.sell], ['intro', '介紹', ICON.book], ['stock', '倉儲', ICON.box], ['me', '我', ICON.user]];
  app.innerHTML = `<div class="m">${headerHTML(st, M.user.name)}<div id="pend"></div><main id="mm"></main></div>
    <div class="cartbar" id="cb"></div>
    <nav class="tabbar">${tabs.map(([k, t, ic]) => `<button data-tab="${k}" class="${M.tab === k ? 'on' : ''}">${ic}<span>${t}</span></button>`).join('')}</nav>`;
  $('#who').onclick = () => go('me');

  ({ sell: renderHome, intro: renderIntro, stock: renderStock, me: renderMe })[M.tab]();

function go(tab) { M.tab = tab; renderSell(); window.scrollTo(0, 0); }

function renderHome() {
  const st = M.data.settings, sm = M.data.summary, sess = curSession();
  const ev = sess ? sm.event.sessions.find(x => x.id === sess.id) : null;
  const nx = !sess && st.autoSession ? nextSession() : null;
  const ps = M.data.products;
  $('#mm').innerHTML = `${st.show.today ? heroHTML({ st, sess, sold: ev ? ev.units : sm.today.units, target: sess ? sess.target : 0, locName: locName(M.loc), today: sm.date, next: nx }) : ''}
    ${st.show.stats ? statsHTML({ st, t: sm.today }) : ''}
    <div class="sec"><h2>品項</h2><span class="lab">${ps.length} items</span></div>
    ${ps.length ? `<div class="grid" id="grid">${ps.map(p => tileHTML(p, { st, qty: cartQty(p.id), stock: stockAt(p.id) })).join('')}</div>` : '<div class="empty">還沒有上架的品項<br><small>請到後台「品項與組合」新增</small></div>'}`;
  const g = $('#grid');
  if (g) g.onclick = e => {
    const a = e.target.closest('[data-add]'), s = e.target.closest('[data-sub]');
    if (a) cartAdd(a.dataset.add, 1); else if (s) cartAdd(s.dataset.sub, -1);
  };
}
function addToCart(cart, pid, warn) {
  const st = M.data.settings, p = M.data.products.find(x => x.id === pid); if (!p) return;
  const inStock = cart.filter(l => l.productId === pid && l.kind === '現貨').reduce((a, l) => a + l.qty, 0);
  const kind = st.allowPreorder && stockAt(pid) - inStock <= 0 ? '預購' : '現貨';
  let l = cart.find(x => x.productId === pid && x.kind === kind);
  if (!l) { l = { productId: pid, qty: 0, price: p.price, kind }; cart.push(l); }
  l.qty++;
  if (warn && kind === '預購' && l.qty === 1) toast(pname(p) + ' 庫存不足，已記為預購', 'warn');
}
function cartAdd(pid, d) {
  const st = M.data.settings, p = M.data.products.find(x => x.id === pid); if (!p) return;
  if (d > 0) { addToCart(M.cart, pid, true); if (navigator.vibrate) navigator.vibrate(10); }
  else {
    const l = M.cart.find(x => x.productId === pid && x.kind === '預購') || M.cart.find(x => x.productId === pid);
    if (l) { l.qty--; if (l.qty <= 0) M.cart.splice(M.cart.indexOf(l), 1); }
  }
  const w = document.querySelector(`.tw[data-w="${CSS.escape(pid)}"]`);
  if (w) w.outerHTML = tileHTML(p, { st, qty: cartQty(pid), stock: stockAt(pid) });
  renderCartBar();
}
const pricingOf = (cart, sets) => priceCart_(cart.map(l => ({ productId: l.productId, qty: l.qty, price: l.price, kind: l.kind })), M.data.bundles, sets);
function renderCartBar() {
  const cb = $('#cb'); if (!cb) return;
  const n = M.cart.reduce((a, l) => a + l.qty, 0);
  if (!n || M.tab !== 'sell') { cb.innerHTML = ''; return; }
  cb.innerHTML = `<button class="cartbtn" id="cbtn"><span class="cnt n">${n}</span>確認登記<span class="tot n">${money(pricingOf(M.cart, M.sets).total)} →</span></button>`;
  $('#cbtn').onclick = () => checkoutSheet({ cart: M.cart, sets: M.sets, form: { payment: M.payment }, onSubmit: submitNew });
};

/** 結帳畫面（新增與修改共用） */
function checkoutSheet({ cart, sets, form, title = '確認銷售', submitLabel = '登記銷售', editing = false, onSubmit }) {
  const st = M.data.settings;
  const f = Object.assign({ payment: M.payment, note: '', customer: '', phone: '', address: '' }, form);
  if (!payOptions(st).includes(f.payment)) f.payment = payOptions(st)[0] || '';
  const m = modal({ title, body: '<div id="co"></div>', foot: `<button class="btn pri lg" id="go">${esc(submitLabel)}</button>` });
  const calc = () => {
    const pr = pricingOf(cart, sets);
    const rev = pr.lines.filter(l => l.kind === '現貨').reduce((a, l) => a + l.net, 0);
    const pre = pr.lines.filter(l => l.kind === '預購').reduce((a, l) => a + l.net, 0);
    return { pr, rev, pre, hasPre: pr.lines.some(l => l.kind === '預購'), collect: rev + (st.preorderPaid ? pre : 0) };
  };
  const draw = () => {
    if (!cart.length && !editing) { m.close(); return; }
    const { pr, rev, pre, hasPre, collect } = calc(), sess = curSession();
    $('#co', m).innerHTML = pr.lines.map((l, i) => { const p = M.data.products.find(x => x.id === l.productId) || { name: l.productId, spec: '' };
      return `<div class="cline"><div class="top"><span class="nm">${esc(pname(p))}</span><span class="n">${money(l.net)}</span></div>
        <div class="ctl"><div class="step"><button data-d="-1" data-i="${i}">−</button><span class="n">${l.qty}</span><button data-d="1" data-i="${i}">+</button></div>
        ${st.allowPreorder ? `<div class="seg"><button data-k="現貨" data-i="${i}" class="${l.kind === '現貨' ? 'on' : ''}">現貨</button><button data-k="預購" data-i="${i}" class="${l.kind === '預購' ? 'on' : ''}">預購</button></div>` : ''}
        <span class="sp"></span>${st.allowPriceEdit ? `<input class="inp pr n" type="number" inputmode="numeric" data-p="${i}" value="${l.price}" aria-label="單價">` : `<span class="lab n">@ ${money(l.price)}</span>`}</div></div>`; }).join('')
      + (editing ? `<div class="lbl lab">加入品項</div><div class="chips">${M.data.products.map(p => `<button class="chip" data-addp="${esc(p.id)}">＋ ${esc(pname(p))}</button>`).join('')}</div>` : '')
      + pr.applied.map(a => `<div class="bund"><div class="t"><b>${esc(a.name)} · ${money(a.price)}</b><span class="lab">${a.sets ? '省 ' + money(a.saving) : '未套用'}</span></div>
          <div class="step"><button data-b="${esc(a.id)}" data-d="-1" ${a.sets ? '' : 'disabled'}>−</button><span class="n">${a.sets}</span><button data-b="${esc(a.id)}" data-d="1" ${a.sets >= a.max ? 'disabled' : ''}>+</button></div></div>`).join('')
      + `<div style="margin-top:18px">
          ${pr.discount ? `<div class="spec"><span>小計</span><span class="n">${money(pr.subtotal)}</span></div><div class="spec"><span>組合優惠</span><span class="n" style="color:var(--ac)">−${money(pr.discount)}</span></div>` : ''}
          ${hasPre ? `<div class="spec"><span>現貨（計入營收）</span><span class="n">${money(rev)}</span></div><div class="spec"><span>預購（${st.preorderPaid ? '本次一併收款' : '不計入本次收款'}）</span><span class="n">${money(pre)}</span></div>` : ''}
          <div class="grand"><span class="lab">本次收款</span><span class="n">${money(collect)}</span></div></div>
        ${hasPre ? `<div class="lbl lab">預購資料${st.preorderContact ? '（姓名或電話必填）' : ''}</div><div class="two"><input class="inp" data-f="customer" placeholder="客人姓名" value="${esc(f.customer)}"><input class="inp" data-f="phone" type="tel" placeholder="電話" value="${esc(f.phone)}"></div>
          <input class="inp" data-f="address" style="margin-top:10px" placeholder="地址${st.preorderAddress ? '（必填）' : '（宅配用，選填）'}" autocomplete="street-address" value="${esc(f.address)}">` : ''}
        <div class="lbl lab">付款方式</div><div class="chips" id="pay">${payOptions(st).map(x => `<button class="chip ${x === f.payment ? 'on' : ''}" data-v="${esc(x)}">${esc(x)}</button>`).join('')}</div>
        ${isEcpayPay(st, f.payment) ? '<p class="note">登記後會顯示付款 QR code，請客人用手機相機掃描付款。</p>' : f.payment === st.cashName && collect ? '<p class="note">登記時會跳出現金收款視窗，自動計算找零。</p>' : ''}
        <div class="lbl lab">備註</div><input class="inp" data-f="note" placeholder="選填：熟客、刻字、包裝…" value="${esc(f.note)}">
        <p class="lab" style="margin:18px 0 0">${esc(editing ? '修改訂單' : (sess ? sess.name : '一般銷售'))} · ${esc(locName(M.loc))} · ${esc(M.user.name)}</p>`;
    $$('[data-i][data-d]', m).forEach(b => b.onclick = () => { const l = cart[+b.dataset.i]; l.qty += +b.dataset.d; if (l.qty <= 0) cart.splice(+b.dataset.i, 1); draw(); });
    $$('[data-k]', m).forEach(b => b.onclick = () => {
      const l = cart[+b.dataset.i]; if (l.kind === b.dataset.k) return;
      const other = cart.find(x => x !== l && x.productId === l.productId && x.kind === b.dataset.k);
      if (other) { other.qty += l.qty; cart.splice(cart.indexOf(l), 1); } else l.kind = b.dataset.k;
      draw();
    });
    $$('[data-p]', m).forEach(i => i.onchange = () => { cart[+i.dataset.p].price = Math.max(0, Number(i.value) || 0); draw(); });
    $$('[data-addp]', m).forEach(b => b.onclick = () => { addToCart(cart, b.dataset.addp, false); draw(); });
    $$('[data-b]', m).forEach(b => b.onclick = () => { const a = pr.applied.find(x => x.id === b.dataset.b); sets[a.id] = Math.max(0, Math.min(a.max, a.sets + +b.dataset.d)); draw(); });
    $$('#pay .chip', m).forEach(b => b.onclick = () => { f.payment = b.dataset.v; if (!editing) { M.payment = f.payment; store.set('payment', M.payment); } draw(); });
    $$('[data-f]', m).forEach(i => i.oninput = () => { f[i.dataset.f] = i.value; });
  };
  m.onclose = () => { if (M.tab === 'sell') { renderHome(); renderCartBar(); } };
  draw();
  $('#go', m).onclick = async () => {
    if (!cart.length) return toast('沒有品項', 'err');
    const { pr, collect } = calc(), sess = curSession();
    const setsReq = {}; pr.applied.forEach(a => setsReq[a.id] = a.sets);
    const order = { clientId: uid(), time: Date.now(), sessionId: sess ? sess.id : '', locationId: M.loc, payment: f.payment,
      note: f.note.trim(), customer: f.customer.trim(), phone: f.phone.trim(), address: f.address.trim(), device: deviceName(), sets: setsReq,
      lines: cart.map(l => ({ productId: l.productId, qty: l.qty, price: l.price, kind: l.kind })) };
    if (order.payment === st.cashName && collect > 0) {
      const got = await cashDialog(collect);
      if (got === null) return;
      order.cashReceived = got;
    } else if (collect > 0 && !isEcpayPay(st, order.payment)) {
      const c = await payConfirmDialog(collect, order.payment, editing);
      if (c === null) return;
      order.confirmed = c === 'yes';
    }
    const go = $('#go', m); go.disabled = true; go.textContent = '處理中…';
    try { await onSubmit(order, { pr, collect, close: () => m.close() }); }
    catch (e) { if (!e.handled) toast(e.message, 'err'); }
    if (document.body.contains(go)) { go.disabled = false; go.textContent = submitLabel; }
  };
}
async function submitNew(order, { pr, collect, close }) {
  const st = M.data.settings;
  const done = () => { M.cart = []; M.sets = {}; close(); renderPending(); if (navigator.vibrate) navigator.vibrate([20, 40, 20]); };
  try {
    const r = await api('apiRecordSale', M.sid, order);
    M.data.summary = r.summary; M.data.stock = r.stock;
    done(); renderPending();
    if (r.order && r.order.payStatus === '待付款') return ecpayDialog(r.order);
    toast(order.cashReceived !== undefined ? `已登記 · 找零 ${money(order.cashReceived - collect)}` : order.confirmed === false ? '已登記，收款待確認' : '已登記並確認收款 ' + money(collect));
  } catch (e) {
    if (e.handled) return;
    if (isNetErr(e) && !isEcpayPay(st, order.payment)) {
      M.pending.push(order); store.set('pending', M.pending);
      order.lines.filter(l => l.kind === '現貨').forEach(l => { const s = M.data.stock[l.productId] = M.data.stock[l.productId] || {}; s[M.loc] = (s[M.loc] || 0) - l.qty; });
      done(); toast('網路不穩，已先存在手機，恢復後自動上傳', 'warn');
    } else throw e;
  }
}

/** 現金收款：輸入實收金額，自動計算找零 */
function cashDialog(due, title = '現金收款') {
  return new Promise(res => {
    let done = false, val = '';
    const up = (n, s) => Math.ceil(n / s) * s;
    const sug = [...new Set([due, up(due, 100), up(due, 500), up(due, 1000), up(due, 1000) + 1000])].filter(v => v >= due).sort((a, b) => a - b).slice(0, 5);
    const m = modal({ title,
      body: `<div class="spec" style="border-top:1px solid var(--ink)"><span>應收</span><span class="n" style="font-size:30px;font-weight:300">${money(due)}</span></div>
        <div class="lbl lab">實收金額</div>
        <input class="inp n" id="cin" type="number" inputmode="numeric" placeholder="輸入客人給的金額" style="font-size:28px;min-height:64px">
        <div class="chips" style="margin-top:10px">${sug.map(v => `<button class="chip n" data-v="${v}">${v === due ? '剛好 ' : ''}${money(v)}</button>`).join('')}</div>
        <div class="change" id="chg"></div>`,
      foot: `<button class="btn line" data-close>取消</button><button class="btn pri lg" id="cok" style="flex:1" disabled>確認收款</button>` });
    const inp = $('#cin', m), ok = $('#cok', m);
    const show = () => {
      const v = Number(val);
      const has = val !== '' && !isNaN(v);
      $('#chg', m).innerHTML = !has ? '' : v >= due
        ? `<span class="lab">找零</span><b class="n">${money(v - due)}</b>`
        : `<span class="lab" style="color:var(--red)">還差</span><b class="n" style="color:var(--red)">${money(due - v)}</b>`;
      ok.disabled = !has || v < due;
    };
    inp.oninput = () => { val = inp.value; show(); };
    $$('[data-v]', m).forEach(b => b.onclick = () => { val = b.dataset.v; inp.value = val; show(); });
    ok.onclick = () => { done = true; m.close(); res(Math.round(Number(val))); };
    m.onclose = () => { if (!done) res(null); };
    setTimeout(() => inp.focus(), 50);
  });
}

/** 非現金、非綠界的付款方式：收款二次確認 */

/* ---- QR code ---- */
const QRLIB = 'https:\/\/cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.5.2/qrcode.min.js';
let qrP;
const loadQr = () => qrP || (qrP = new Promise((res, rej) => {
  if (window.qrcode) return res(window.qrcode);
  const s = document.createElement('script'); s.src = QRLIB;
  s.onload = () => res(window.qrcode); s.onerror = () => { qrP = null; rej(new Error('QR 產生器載入失敗，請檢查網路')); };
  document.head.appendChild(s);
}));
async function qrSvg(text) {
  const q = await loadQr();
  if (q.stringToBytesFuncs && q.stringToBytesFuncs['UTF-8']) q.stringToBytes = q.stringToBytesFuncs['UTF-8'];
  const qr = q(0, 'M'); qr.addData(text); qr.make();
  const n = qr.getModuleCount(); let d = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) d += `M${c + 3},${r + 3}h1v1h-1z`;
  return `<svg viewBox="0 0 ${n + 6} ${n + 6}" shape-rendering="crispEdges" role="img" aria-label="QR code"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#111"/></svg>`;
}
async function fillQr(el, text) { try { el.innerHTML = await qrSvg(text); } catch (e) { el.innerHTML = `<span class="faint" style="font-size:12px;padding:10px;word-break:break-all">${esc(text)}</span>`; } }

/** 綠界：顯示付款 QR，等客人付款 */
function ecpayDialog(order) {
  const st = M.data.settings;
  let timer, closed = false;
  const m = modal({ title: '請客人掃碼付款',
    body: `<div class="spec" style="border-top:1px solid var(--ink)"><span>付款金額</span><span class="n" style="font-size:30px;font-weight:300">${money(order.collected)}</span></div>
      <div class="qrbig" id="qr"><div class="spin"></div></div>
      <p class="paystat" id="pst"><span class="tag amb">等待付款</span></p>
      <p class="note">請客人用手機相機掃描（不要用 LINE 掃），在綠界頁面完成付款，這裡會自動顯示「已付款」。</p>
      ${DEMO ? '<button class="btn line" id="demoPay" style="width:100%;margin-top:6px">預覽：模擬客人付款完成</button>' : ''}`,
    foot: `<button class="btn line" id="toCash">改收現金</button><button class="btn danger" id="cancel">取消訂單</button><span class="sp"></span><button class="btn pri" data-close>稍後</button>` });
  fillQr($('#qr', m), payUrl(order.payKey));
  const paid = () => {
    clearInterval(timer);
    $('#pst', m).innerHTML = '<span class="paid">✓ 已付款</span>';
    $('#qr', m).style.opacity = .25;
    m.querySelector('.dlg-f').innerHTML = '<button class="btn line" data-close>稍後確認</button><button class="btn pri lg" id="cfm" style="flex:1">確認收款</button>';
    $('#cfm', m).onclick = async () => { try { const r = await api('apiConfirmPayment', M.sid, order.orderId); M.data.summary = r.summary; m.close(); renderPending(); toast('已確認收款'); } catch (e) { if (!e.handled) toast(e.message, 'err'); } };
    toast('綠界付款完成 ' + money(order.collected)); refreshSummary(true);
  };
  const poll = async () => {
    try { const r = await api('apiPayStatus', M.sid, order.orderId); if (closed) return;
      if (r.status === '作廢') { clearInterval(timer); $('#pst', m).innerHTML = '<span class="tag red">已取消</span>'; return; }
      if (r.payStatus === '已付款') paid(); else if (r.payStatus && r.payStatus !== '待付款') $('#pst', m).innerHTML = `<span class="tag red">${esc(r.payStatus)}</span>`;
    } catch (e) {}
  };
  timer = setInterval(poll, 3000);
  m.onclose = () => { closed = true; clearInterval(timer); if (M.tab === 'me') renderMe(); };
  const dp = $('#demoPay', m); if (dp) dp.onclick = async () => { await api('apiDemoPay', order.orderId); poll(); };
  $('#toCash', m).onclick = async () => {
    const got = await cashDialog(order.collected); if (got === null) return;
    try { await api('apiSetPayment', M.sid, order.orderId, st.cashName, got); m.close(); toast(`已改為現金 · 找零 ${money(got - order.collected)}`); }
    catch (e) { if (!e.handled) toast(e.message, 'err'); }
  };
  $('#cancel', m).onclick = async () => {
    if (!await confirmBox('取消這筆訂單？', '訂單會刪除，現貨件數退回庫存。', '取消訂單', true)) return;
    try { const r = await api('apiVoidMyOrder', M.sid, order.orderId); M.data.summary = r.summary; M.data.stock = r.stock; m.close(); toast('已取消訂單'); }
    catch (e) { if (!e.handled) toast(e.message, 'err'); }
  };
}

function renderPending() {
  const el = $('#pend'); if (!el) return;
  const un = (M.data.summary.today || {}).myUnconfirmed || 0;

let flushing = false;
async function flushPending() {
  if (flushing || !M.pending || !M.pending.length) return;
  flushing = true;
  try {
    while (M.pending.length) {
      const r = await api('apiRecordSale', M.sid, M.pending[0]);
      M.pending.shift(); store.set('pending', M.pending); M.data.summary = r.summary; M.data.stock = r.stock;
    }
    toast('暫存的銷售已全部上傳');
  } catch (e) { if (!isNetErr(e) && !e.handled) toast('上傳失敗：' + e.message, 'err'); }
  flushing = false;
  renderPending(); if (M.tab === 'sell' && !document.querySelector('.ov')) renderHome();
}
async function refreshSummary(force) {

        : `${inApp ? '<p class="note" style="color:var(--red);border-color:var(--red)">你正在 LINE／Facebook／Instagram 內開啟，可能無法付款。請點右上角「⋯」選擇「用瀏覽器開啟」。</p>' : ''}
           <button class="btn ac lg" id="topay">前往綠界付款 →</button>
           ${info.stage ? '<p class="lab" style="margin-top:10px">測試環境：不會實際扣款</p>' : ''}
           <p class="muted" style="font-size:13px;margin-top:14px">付款完成後會自動回到這一頁顯示結果。</p>`}
    </div></div>`;
  const b = $('#topay', root);
  if (b && info.form) b.onclick = () => {
    const f = document.createElement('form');
    f.method = 'POST'; f.action = info.form.action; f.target = '_top'; f.acceptCharset = 'UTF-8';
    Object.entries(info.form.fields).forEach(([k, v]) => { const i = document.createElement('input'); i.type = 'hidden'; i.name = k; i.value = v; f.appendChild(i); });

}

      <p class="note">顯示在手機「介紹」頁最上方，點開可以放大給客人掃。填連結會自動產生 QR code，也可以直接上傳 QR 圖片（例如 LINE 官方帳號的 QR）。</p>
      ${d.qrs.length ? `<table class="t"><thead><tr><th style="width:70px"></th><th>標題</th><th>連結</th><th>顯示</th><th>順序</th><th></th></tr></thead><tbody>
        ${d.qrs.map((q, i) => `<tr><td><div class="qrbox" style="width:56px" data-aq="${esc(q.id)}"></div></td><td>${esc(q.title)}<br><span class="faint" style="font-size:13px">${esc(q.note)}</span></td><td class="faint" style="word-break:break-all;font-size:13px">${q.image ? '（上傳的圖片）' : esc(q.url)}</td>
          <td>${q.active ? '<span class="tag ok">顯示</span>' : '<span class="tag">隱藏</span>'}</td>
          <td style="white-space:nowrap"><button class="btn sm ghost" data-qm="${i},-1" ${i ? '' : 'disabled'}>↑</button><button class="btn sm ghost" data-qm="${i},1" ${i < d.qrs.length - 1 ? '' : 'disabled'}>↓</button></td>
          <td class="r"><button class="btn sm line" data-qe="${esc(q.id)}">編輯</button></td></tr>`).join('')}</tbody></table>` : '<p class="muted">還沒有 QR code</p>'}
    </div>
    <div class="box"><h3>檔案<span class="sp"></span><span class="lab">${d.materials.length} files</span></h3><table class="t"><thead><tr><th>檔名</th><th class="r">大小</th><th>更新</th><th></th></tr></thead><tbody>
    ${d.materials.map(x => `<tr><td><div class="row"><span class="lab" style="color:var(--ac)">PDF</span>${esc(x.name)}</div></td><td class="r n faint">${fmtSize(x.size)}</td><td class="n faint">${fmtDT(x.updated)}</td>
      <td class="r" style="white-space:nowrap"><button class="btn sm line" data-pv="${esc(x.id)}">預覽</button> <button class="btn sm line" data-rn="${esc(x.id)}">改名</button> <button class="btn sm danger" data-dl="${esc(x.id)}">刪除</button></td></tr>`).join('') || '<tr><td colspan="4" class="faint" style="text-align:center;padding:40px">還沒有檔案</td></tr>'}
    </tbody></table></div>`;
  const dz = $('#dz'), pf = $('#pf');
  const up = async files => {
    for (const f of files) {
      if (!/pdf$/i.test(f.type) && !/\.pdf$/i.test(f.name)) { toast(f.name + ' 不是 PDF', 'err'); continue; }
      if (f.size > 25 * 1048576) { toast(f.name + ' 超過 25 MB，請先壓縮', 'err'); continue; }
      toast('上傳中：' + f.name);
      const b64 = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1]); fr.onerror = rej; fr.readAsDataURL(f); });
      try { await act(() => api('apiUploadMaterial', f.name, b64), '已上傳 ' + f.name); } catch (e) {}
    }
  };
  pf.onchange = () => up([...pf.files]);
  dz.ondragover = e => { e.preventDefault(); dz.classList.add('over'); };
  dz.ondragleave = () => dz.classList.remove('over');
  dz.ondrop = e => { e.preventDefault(); dz.classList.remove('over'); up([...e.dataTransfer.files]); };
  const find = id => d.materials.find(x => x.id === id);
  $$('[data-pv]').forEach(b => b.onclick = () => openViewer(find(b.dataset.pv), '__admin__'));
  d.qrs.forEach(q => { const el = document.querySelector(`[data-aq="${CSS.escape(q.id)}"]`); if (q.image) el.innerHTML = `<img src="${esc(q.image)}" alt="">`; else fillQr(el, q.url); });
  $('#addQ').onclick = () => qrEditor();
  $$('[data-qe]').forEach(b => b.onclick = () => qrEditor(d.qrs.find(q => q.id === b.dataset.qe)));
  $$('[data-qm]').forEach(b => b.onclick = () => { const [i, dd] = b.dataset.qm.split(',').map(Number); const ids = d.qrs.map(q => q.id); [ids[i], ids[i + dd]] = [ids[i + dd], ids[i]]; act(() => api('apiSaveOrder', 'qrcodes', ids)); });
  $$('[data-rn]').forEach(b => b.onclick = () => {
    const x = find(b.dataset.rn);
    const m = modal({ title: '改名', body: `<input class="inp" id="nn" value="${esc(x.name)}">`, foot: `<span class="sp"></span><button class="btn line" data-close>取消</button><button class="btn pri" id="ok">儲存</button>` });
    $('#ok', m).onclick = async () => { try { await act(() => api('apiRenameMaterial', x.id, $('#nn', m).value), '已改名'); m.close(); } catch (e) {} };
  });
  $$('[data-dl]').forEach(b => b.onclick = async () => { const x = find(b.dataset.dl); if (await confirmBox('刪除檔案？', `「${x.name}」會從簡介資料中刪除，無法還原。`, '刪除', true)) act(() => api('apiDeleteMaterial', x.id), '已刪除'); });
}

function qrEditor(q) {
  const isNew = !q; q = q || { title: '', note: '', url: '', image: '', active: true };
  let image = q.image, active = q.active;
  const m = modal({ title: isNew ? '新增 QR code' : '編輯 QR code',
    body: `<label class="field"><span>標題</span><input class="inp" id="qt" value="${esc(q.title)}" placeholder="例：Instagram、官方 LINE、品牌官網"></label>
      <label class="field"><span>說明（選填）</span><input class="inp" id="qn" value="${esc(q.note)}" placeholder="例：追蹤新品消息"></label>
      <label class="field"><span>連結（自動產生 QR code）</span><input class="inp" id="qu" value="${esc(q.url)}" placeholder="https:\/\/"></label>
      <div class="lab" style="margin:4px 0 10px">或上傳 QR 圖片（有圖片時優先使用）</div>
      <div class="row" style="align-items:flex-start;gap:16px"><label class="imgbox" id="qi" style="width:140px">${image ? `<img src="${esc(image)}" alt="">` : '上傳圖片'}<input type="file" accept="image/\x2a" hidden id="qf"></label>
        <div><div class="qrbox" id="qp" style="width:140px"></div><p class="lab" style="margin-top:6px">預覽</p></div></div>
      ${image ? '<button class="btn sm line" id="qx" style="margin-top:10px">移除圖片</button>' : ''}
      <div class="togrow" style="margin-top:16px;border-top:1px solid var(--line)"><div>顯示在手機介紹頁</div><button class="sw ${active ? 'on' : ''}" id="qa" type="button"></button></div>`,
    foot: `${isNew ? '' : '<button class="btn danger" id="del">刪除</button>'}<span class="sp"></span><button class="btn line" data-close>取消</button><button class="btn pri" id="ok">儲存</button>` });
  const pv = () => { const el = $('#qp', m); if (image) el.innerHTML = `<img src="${esc(image)}" alt="">`; else if ($('#qu', m).value.trim()) fillQr(el, $('#qu', m).value.trim()); else el.innerHTML = ''; };
  pv();
  $('#qu', m).oninput = () => { clearTimeout(m._t); m._t = setTimeout(pv, 300); };
  $('#qf', m).onchange = async e => { try { image = await processImage(e.target.files[0]); $('#qi', m).innerHTML = `<img src="${image}" alt="">`; $('#qi', m).appendChild($('#qf', m) || e.target); pv(); } catch (er) { toast(er.message, 'err'); } };
  const qx = $('#qx', m); if (qx) qx.onclick = () => { image = ''; $('#qi img', m) && $('#qi img', m).remove(); qx.remove(); pv(); };
  const sw = $('#qa', m); sw.onclick = () => { active = !active; sw.classList.toggle('on', active); };
  $('#ok', m).onclick = async () => { try { await act(() => api('apiSaveQr', { id: q.id, title: $('#qt', m).value, note: $('#qn', m).value, url: $('#qu', m).value, image, active }), '已儲存'); m.close(); } catch (e) {} };
  const del = $('#del', m); if (del) del.onclick = async () => { if (await confirmBox('刪除 QR code？', `「${q.title}」會從介紹頁移除。`, '刪除', true)) { try { await act(() => api('apiDeleteQr', q.id), '已刪除'); m.close(); } catch (e) {} } };
}

  app.innerHTML = `<div class="center"><div style="width:min(520px,100%)">${logoHTML(null, 22)}
